<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>敏捷專案管理題庫</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#f6f7fb;--card:#fff;--tx:#1d2333;--mu:#667085;--bd:#dfe3ec;--ac:#3b5bdb;--ok:#2b8a3e;--okb:#e6f6ea;--no:#c92a2a;--nob:#fdeaea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151e;--card:#1b2030;--tx:#e8eaf2;--mu:#9aa3b8;--bd:#2d3447;--ac:#7c93ff;--ok:#69db7c;--okb:#16301e;--no:#ff8787;--nob:#3a1b1b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12151e;--card:#1b2030;--tx:#e8eaf2;--mu:#9aa3b8;--bd:#2d3447;--ac:#7c93ff;--ok:#69db7c;--okb:#16301e;--no:#ff8787;--nob:#3a1b1b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
main{max-width:680px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:8px 0 4px}
.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
button{font:inherit;color:inherit;cursor:pointer}
.menu button{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card)}
.menu button:hover{border-color:var(--ac)}
.menu b{display:block}.menu span{color:var(--mu);font-size:.88rem}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:10px 0 16px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem}
.q{font-size:1.1rem;font-weight:600;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card)}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt::before{content:attr(data-k) ". ";color:var(--mu);font-weight:600}
.opt.ok{background:var(--okb);border-color:var(--ok)}
.opt.no{background:var(--nob);border-color:var(--no)}
.exp{margin-top:12px;padding:12px;border-radius:10px;background:var(--bg);font-size:.95rem}
.primary{padding:12px 20px;border-radius:10px;border:0;background:var(--ac);color:#fff;margin-top:12px}
.ghost{padding:10px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);margin:12px 8px 0 0}
.score{font-size:2.4rem;font-weight:700;color:var(--ac);margin:0}
.wr{border-top:1px solid var(--bd);padding:12px 0;font-size:.95rem}
.wr small{color:var(--mu)}
.hide{display:none}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.tab{flex:1 1 45%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card)}.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}

.hero{background:linear-gradient(135deg,var(--ac),#7048e8);color:#fff;border-radius:18px;padding:22px 20px;margin:4px 0 18px}
.hero h1{margin:0 0 4px;font-size:1.6rem}.hero p{margin:0;opacity:.9;font-size:.92rem}
.grp{font-size:.8rem;font-weight:700;color:var(--mu);letter-spacing:.06em;margin:16px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tab{display:flex;flex-direction:column;gap:4px;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);flex:none}
.tab b{font-size:.92rem;line-height:1.3}.tab small{color:var(--mu);font-size:.78rem}
.tab:hover{border-color:var(--ac)}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 4px 14px rgba(59,91,219,.3)}.tab.on small{color:#fff;opacity:.85}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-top:20px}
.ph{margin-bottom:12px}.pl{font-size:.78rem;color:var(--ac);font-weight:700}.panel h2{margin:2px 0 0;font-size:1.2rem}
.menu button{display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.stat{display:flex;gap:10px;margin-top:6px}.stat div{flex:1;background:var(--bg);border-radius:10px;padding:10px;text-align:center;font-size:.8rem;color:var(--mu)}.stat b{display:block;font-size:1.15rem;color:var(--tx)}
.back{background:none;border:0;color:var(--ac);padding:4px 0 10px;font-weight:600}.panel{margin-top:4px}

.selbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}.selbar span{margin-left:auto;color:var(--mu);font-size:.85rem}
.mini{padding:6px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);font-size:.85rem}
.row{display:flex;align-items:stretch;gap:8px;margin-bottom:8px}
.ck{flex:1;display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card)}
.ck i{width:20px;height:20px;border-radius:6px;border:2px solid var(--bd);flex:none;display:grid;place-items:center;font-style:normal;font-size:.8rem;color:#fff}
.ck.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,var(--card))}.ck.on i{background:var(--ac);border-color:var(--ac)}
.ck b{display:block;font-size:.95rem}.ck small{color:var(--mu);font-size:.78rem}
.go{padding:0 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--ac);font-size:.85rem;white-space:nowrap}
.qi{border-top:1px solid var(--bd);padding:10px 0}.qi summary{cursor:pointer;font-weight:600}.qi ul{margin:8px 0;padding-left:20px;color:var(--mu)}.qi li.a{color:var(--ok);font-weight:600}.qi p{margin:6px 0 0;font-size:.92rem}
.wbk{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:14px 16px;margin-top:20px;border-radius:14px;border:1px solid var(--no);background:var(--nob)}
.wbk b{display:block}.wbk small{color:var(--mu);font-size:.82rem}.wbk em{font-style:normal;color:var(--no);font-size:.88rem;white-space:nowrap}
.wg{font-weight:700;margin:16px 0 4px;color:var(--ac);font-size:.9rem}
.wi{border-top:1px solid var(--bd);padding:12px 0}.wi .qq{font-weight:600;margin:0 0 6px}
.wi .ans{color:var(--ok);font-weight:600;margin:0 0 6px}.wi .ex{margin:0;padding:10px;border-radius:10px;background:var(--bg);font-size:.92rem;white-space:pre-line}
.wi .rm{margin-top:8px;padding:5px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);font-size:.82rem}
.wi ul{margin:6px 0;padding-left:20px;color:var(--mu)}

:root{--onac:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--onac:#12151e}}
:root[data-theme="dark"]{--onac:#12151e}
main{max-width:1320px;padding:20px 24px 48px}
#quiz,#result,#wbPg,#chapPg{max-width:700px;margin-left:auto;margin-right:auto}
.hero{background:none;color:var(--tx);padding:0;border-radius:0;margin:4px 0 18px}.hero h1{font-size:1.45rem}.hero p{color:var(--mu);opacity:1}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px 28px;margin-bottom:20px}
.tcard{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.tcard h2{margin:0 0 4px;font-size:1.25rem}.tcard p{margin:0;color:var(--mu);font-size:.92rem}
.tb{display:flex;gap:12px;flex-wrap:wrap}
.btnp{padding:14px 26px;border-radius:12px;border:0;background:var(--ac);color:var(--onac);font-weight:700;font-size:1rem}
.btns{padding:14px 22px;border-radius:12px;border:1px solid var(--bd);background:transparent}
.dim{opacity:.55}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}.sec{padding:18px 16px}}
.fg{padding:18px 0;border-bottom:1px dashed var(--bd)}.fg:first-child{padding-top:0}.fg:last-child{border-bottom:0;padding-bottom:0}
.fl{font-size:.8rem;color:var(--mu);margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:12px 20px;border-radius:999px;border:1px solid var(--bd);background:transparent;font-size:1rem}
.chip:hover{border-color:var(--ac)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
details>summary{cursor:pointer;list-style:none;font-weight:700}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"\25B6";display:inline-block;font-size:.75em;margin-right:8px;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
details>summary small{color:var(--mu);font-weight:400;margin-left:6px}
.tpl{margin-top:14px;display:grid;gap:8px}
.tpi{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:transparent}
.tpi i{width:20px;height:20px;border-radius:6px;border:2px solid var(--bd);flex:none;display:grid;place-items:center;font-style:normal;font-size:.8rem;color:var(--onac)}
.tpi.on{border-color:var(--ac)}.tpi.on i{background:var(--ac);border-color:var(--ac)}
.tpi span{flex:1}.tpi small{color:var(--mu)}
.shl{display:flex;align-items:center;gap:10px;cursor:pointer}.shl input{width:20px;height:20px;accent-color:var(--ac)}
.fgo{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.fgo small{color:var(--mu)}
.pi{border-top:1px solid var(--bd);padding:12px 0}.pi:first-child{border-top:0}
.pih{display:flex;align-items:center;justify-content:space-between;gap:10px}.pih b{font-size:.95rem}
.pi .bar{margin:8px 0 6px}.pi small{color:var(--mu)}
.pbody{margin-top:14px}
#fillPg{max-width:1100px;margin:0 auto}
.fsec{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 20px;margin-bottom:18px}
.fsec h3{margin:0 0 4px;font-size:1.1rem}.fsec>p{margin:0 0 14px;color:var(--mu);font-size:.9rem}
.fcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.fcol{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px}
.fhead{margin-bottom:6px}
.fhead .bl,.fhead .gv{border-radius:999px;text-align:center;font-weight:700;font-size:.95rem;padding:9px 14px}
.fhead .gv{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.fl2{font-size:.74rem;color:var(--mu);margin:12px 0 6px;font-weight:700}
.gv{display:block;padding:7px 10px;margin:0 0 6px;border-radius:8px;background:color-mix(in srgb,var(--ok) 10%,var(--card));border:1px solid color-mix(in srgb,var(--ok) 35%,var(--bd));font-size:.88rem}
.bl{display:block;width:100%;text-align:left;padding:7px 10px;margin:0 0 6px;border-radius:8px;border:2px dashed var(--ac);background:var(--card);font-size:.88rem;min-height:36px}
.bl.act{background:color-mix(in srgb,var(--ac) 20%,var(--card));box-shadow:0 0 0 2px var(--ac)}
.bl.ok{border:2px solid var(--ok);background:var(--okb)}.bl.no{border:2px solid var(--no);background:var(--nob)}
.bl .rt{display:block;color:var(--ok);font-weight:700;font-size:.85rem;margin-top:3px}
.bl .hn{display:block;color:var(--mu);font-size:.72rem;margin-top:2px}
.bl s{opacity:.7}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--bd)}
.bank .chip{padding:8px 14px;font-size:.88rem}.bank .chip.used{opacity:.3}
.fres{border:1px solid var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--card));border-radius:14px;padding:14px 18px;margin-bottom:16px}
.fres b{font-size:1.3rem}
.fbar{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 16px}
.imgsc{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:#fff;margin-bottom:16px}
.imgw{position:relative;min-width:900px;container-type:inline-size}
.imgw img{display:block;width:100%;height:auto}
.ov{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;line-height:1.1;border:1.5px solid #e0a100;background:#fff3bf;color:#5c4400;font-weight:700;font-size:clamp(6px,.95cqw,13px);border-radius:3px}
.ov.fl{background:#d0e0ff;border-color:#3b5bdb;color:#1d2d6b}
.ov.ok{background:#d3f9d8;border-color:#2b8a3e;color:#0b4a1d}
.ov.no{background:#ffe3e3;border-color:#c92a2a;color:#7a0b0b}
.ov.ok,.ov.no{font-size:clamp(5px,.7cqw,11px);padding:0 1px;font-weight:600}
.ov i{position:absolute;left:0;top:0;font-style:normal;font-size:.7em;background:#555;color:#fff;padding:0 3px;border-radius:0 0 3px 0;line-height:1.2}
.frows{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:4px 20px}
.frow{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start}
.frow .n{flex:none;width:30px;height:30px;border-radius:50%;background:#e0a100;color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem;margin-top:3px}
.frow .fb{flex:1;min-width:0}
.frow input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.frow input:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.frow small{display:block;color:var(--mu);font-size:.74rem;margin-top:2px}
.frow.ok input{border:2px solid var(--ok);background:var(--okb)}.frow.no input{border:2px solid var(--no);background:var(--nob)}
.frow .rt{display:block;color:var(--ok);font-weight:700;font-size:.88rem;margin-top:3px}
</style>
</head>
<body>
<main>
<div id="home">
  <header class="hero" id="hero"><h1>敏捷專案管理題庫</h1><p id="tot"></p></header>
  <div id="mainPg">
    <section class="sec tcard"><div><h2>開始今天的練習</h2><p id="tsub"></p></div>
      <div class="tb"><button class="btnp" id="quick">快速練 10 題</button><button class="btns" id="fbtn">🧩 流程圖填空</button><button class="btns" id="wbk2">📕 錯題本 (0)</button></div></section>
    <div class="cols">
      <section class="sec">
        <div class="fg"><p class="fl">章節</p><div class="chips" id="fch"></div></div>
        <div class="fg"><p class="fl">題目來源</p><div class="chips" id="fsrc"></div></div>
        <div class="fg"><details id="tpd"><summary>選擇主題<small id="tpsum">全部主題</small></summary><div class="pbody"><button class="mini" id="tpclr">清除選取</button><div class="tpl" id="ftl"></div></div></details></div>
        <div class="fg"><p class="fl">出題範圍</p><div class="chips" id="fsc"></div></div>
        <div class="fg"><p class="fl">題數</p><div class="chips" id="fcnt"></div></div>
        <div class="fg"><label class="shl"><input type="checkbox" id="fsh"><span>打亂選項順序</span></label></div>
        <div class="fg fgo"><button class="btnp" id="fgo">開始測驗</button><small id="finfo"></small></div>
      </section>
      <section class="sec"><details id="prog"><summary>答題卡與學習進度<small id="psum"></small></summary><div class="pbody" id="plist"></div></details></section>
    </div>
  </div>
  <section class="panel hide" id="wbPg"><button class="back" id="wback">← 返回首頁</button>
    <div class="ph"><span class="pl">錯題本</span><h2 id="wtitle"></h2></div>
    <div class="menu"><button id="wprac"><b>練習全部錯題</b><span>做對的題目會自動從錯題本移除</span></button></div>
    <div id="wlist"></div></section>
  <section class="panel hide" id="chapPg"><button class="back" id="back">← 返回首頁</button>
    <div class="ph"><span class="pl">章節題目</span><h2 id="sub"></h2></div>
    <div class="stat" id="stat2"></div><div class="menu"><button id="only"><b>只練習這一章</b><span>回首頁並篩選本章</span></button></div>
    <div id="qlist"></div></section>
</div>
<section class="hide" id="fillPg"><button class="back" id="fback">← 返回首頁</button>
    <div class="ph"><span class="pl">流程圖填空</span><h2>敏捷專案管理流程圖</h2></div>
    <p class="sub">圖上所有標籤(除了右下角那段說明文字)都用黃色編號框蓋住了。請依編號,在下方輸入框用打字作答。按「檢查答案」後,答錯的格子會在圖上與下方顯示正確答案,並自動收進錯題本。</p>
    <div id="fmode" class="chips" style="margin-bottom:14px"></div><div id="fres"></div><div id="fimgbox"></div><div id="fillBody"></div><div class="fbar" id="fact"></div></section>
<div id="quiz" class="hide"></div>
<div id="result" class="hide"></div>
</main>
<script>
// [題目, 正確答案, 錯誤1, 錯誤2, 錯誤3, 解析]
var Q=[
["APMF 架構用來表達專案的四個面向,不包含下列哪一項?","預算","參與人員","階段","產出","四個面向是參與人員、階段、工作事項、產出。"],
["「準備營運企劃案(商業論證)」屬於哪一個階段?","可行性分析階段","起始階段","發布循環階段","結束階段","可行性分析階段包含:建立共同願景、準備營運企劃案、核准專案。"],
["下列哪一項是迭代循環子階段的產出?","燃盡圖","產品盒、願景卡","專案核准文件","角色卡","迭代產出含工作卡、驗收測試案例、增量成果、迭代待辦清單、用戶故事看板、燃盡圖、改進行動方案。"],
["一次發布包含 2 次迭代,每次迭代 2 週,發布期間為多久?","4 週","2 週","3 週","8 週","2 × 2 = 4 週。"],
["簡報範例中,「每日立會」的時間盒為多長?","15 分鐘","30 分鐘","1 小時","2 小時","每日立會固定 15 分鐘。"],
["APMF 中,負責面對贊助者或發起人的角色是?","敏捷教練","產品負責人","測試者","利害關係人","Scrum 由 Scrum 大師負責,APMF 則由敏捷教練負責。"],
["關於產品負責人,下列敘述何者錯誤?","主要負責促進站立會議與回顧會議","通常只有一個","必須擁有決策權","決定該做什麼以及做的順序","促進各種會議是敏捷教練的工作。"],
["「通用專家(Generalizing Specialists)」的意思是?","擁有多項專精,可互相幫忙,但不須樣樣精通","只專精單一工作","必須精通所有工作","只有領導者需多項專長","通用專家不只做專一工作,但也不是樣樣專精的通才。"],
["形成高效能團隊的四個階段,正確順序為?","建立期→風暴期→規範期→高效期","建立期→規範期→風暴期→高效期","風暴期→建立期→規範期→高效期","建立期→風暴期→高效期→規範期","Forming→Storming→Norming→Performing。"],

var EX=[
"APMF 用四個面向來表達專案:參與人員(由誰做)、階段(從開始到結束)、工作事項(做什麼)、產出(成果,含流程產出與工作產出)。預算並非這四個面向之一,是常見的混淆選項。",
"可行性分析是第一個階段,目的是決定專案值不值得做:建立共同願景(產出產品盒、願景卡)、準備營運企劃案(商業論證)、核准專案。起始階段才開始發展章程、辨識角色與建立待辦清單。",
"迭代循環的產出都和單次迭代的執行有關:工作卡、驗收測試案例、增量成果、迭代待辦清單、用戶故事看板、燃盡圖、改進行動方案。產品盒屬可行性分析,角色卡屬起始階段,核准文件也屬可行性分析。",
"發布期間 = 迭代次數 × 每次迭代長度,即 2 × 2 = 4 週。發布期間還包含發布規劃與發布回顧,但它們都在時間盒內完成;期間結束後必須把增量成果交付給客戶。",
"簡報的時間盒範例:專案 6 個月、發布 1 個月、迭代 2 週、每日立會 15 分鐘。固定且很短的時間,是為了讓會議聚焦在進度與障礙,不演變成冗長討論。",
"在 Scrum 由 Scrum 大師面對贊助者或發起人,APMF 中改由敏捷教練負責。產品負責人面對的是需求與優先順序,利害關係人與贊助者則是被溝通的對象。",
"產品負責人決定做什麼與順序、擁有決策權、通常只有一人。但促進每日站立會議、規劃會議、審查與回顧會議,是敏捷教練以僕人式領導支援團隊的工作,所以此項敘述錯誤。",
"通用專家擁有多項專精,能互相補位,不被單一工作綁住;但也不要求樣樣精通的通才。這樣才能讓團隊自我組織,依待辦清單排序挑工作,不會因某人缺席而卡住。",
"高效能團隊的發展順序是建立期(互相認識)、風暴期(互相挑戰)、規範期(共同協作並建立工作協議)、高效期(如同一人運作)。記法:Forming、Storming、Norming、Performing。",
"等級 3 競爭:有人身攻擊、重勝負勝過解決問題,必須由第三方調停、談判並回到事實。合作雙贏是等級 1,支持授權是等級 2,安全結構與外交手段是等級 4。",
"APMF 是價值驅動的專案管理:團隊所做的任何工作都須遵從專案願景,依商業價值排序,經由發布與迭代持續交付有價值成果。重點是價值最大化,而不是單純降成本或照計畫走。",
"簡報用中華文化的陰陽平衡比喻:科學化管理(計畫、估算、度量)與人性化管理(自我組織、信任、授權)要融合協調。每家企業的平衡點不一定在中間。",
"傳統專案把客戶放在團隊之外,敏捷則把利害關係人代表(產品負責人/客戶代表)納入團隊,甲方乙方同隊,共同決策與排序。這是兩者最大的差異。",
"敏捷採漸進明細:一開始只做大方向規劃,不做詳細需求分析,以小步快跑方式盡快發布並取得客戶回饋,再據以修改產品與後續規劃。",
"簡報建議發布週期最好不超過一個月,讓客戶能在最短時間看到成果並回饋,降低失敗風險。週期過長會延遲回饋,背離敏捷精神。",
"起始階段的五項工作:發展專案章程、辨識角色、建立產品待辦清單、進行高階估算、建立產品地圖。核准專案屬可行性分析,發布回顧屬發布循環,交付成果屬結束階段。",
"角色卡是辨識角色的產出,用來更詳細地描述利害關係人(誰、關心什麼、影響力等)。迭代進度看燃盡圖或看板,估算與驗收標準則屬發布循環階段。",
"估算用戶故事點數時,團隊成員各自出牌表達估算,出現差異再討論,能避免被少數人影響。簡報標示為「玩撲克牌」,即規劃撲克。",
"刺探(Spike)是在發布期間為下一迭代預先蒐集用戶故事的細節資料,讓之後的迭代規劃更準確。驗收、回顧、核准都不是刺探的目的。",
"結束階段只有三件事:交付專案產品/成果、進行專案回顧會議、結束專案活動,產出為專案成果與改進行動方案。其餘選項分別屬於起始、可行性分析階段。",
"迭代是短週期,每次約 1~2 週。短週期才能快速取得回饋;若拉長到數月就和傳統做法無異,而 1~2 天又太短,不足以產出可驗收的增量成果。",
"在一次迭代中,先做迭代規劃,之後分析、設計、寫程式、測試同步進行(見圖 3-2),最後進行迭代審查與回顧。並非瀑布式的依序完成。",
"敏捷團隊是被充分授權、自我組織的跨職能團隊,與外界以開放、透明、頻繁的方式溝通,而不是孤軍奮戰。由主管逐項指派屬於傳統命令與控制的做法。",
"簡報強調最重要的紀律是固定時間(時間盒):專案、發布、迭代、每日立會都要在固定時間內完成,以不變的步調與節奏因應萬變的環境與需求。",
"簡報列出的注意事項為時區的不同、階級的意識、更多的文件、文化的差異,這些都影響指導與溝通方式,特別是跨地區團隊。預算多寡並不在其中。",
"自律是主動拿工作來做,不等別人告知下一步。這對應敏捷原則第 5 條:專案靠積極的個人完成,給予環境與支持並相信他們。",
"透明化是把規劃、流程、決策與迭代執行狀況以圖表展現在牆上,讓團隊提早看出問題、互相協助、避免失敗風險。口頭報告或保密都不利於此。",
"共同分擔責任:建立互助模式,在每個規劃會議共同制定並承諾計畫,每位成員都有責任參與。此項對應原則第 2 條,敏捷流程能掌控變更,以維護客戶的競爭優勢。",
"團隊章程由團隊在起始階段共同制定,建立核心價值與工作協議,是全體成員要共同遵守的基本原則(Ground Rules),也呼應原則第 11 條:最佳設計來自自我組織的團隊。",
"開發團隊通常少於 12 人。人數太多會使溝通成本與協調成本上升,不利於自我組織與每日立會的效率。",
"團隊成員依專長,挑選待辦清單最上面(對客戶價值最高)的工作,使團隊能最敏捷地朝交付目標前進。排序由產品負責人決定,不是由個人偏好或主管指派。",
"敏捷教練以僕人式領導協助團隊,不是下達命令與管制,而是協助自我組織、合作並建立信任。命令與控制是傳統管理方式。",
"流程裁適是依企業需求,在一般性流程框架中挑選並整合出適合的流程。這也呼應本章重點:符合敏捷心態,流程與工具可依組織文化調整。",
"敏捷教練的工作包括:擋掉干擾、移除障礙、促進會議、確認大家遵循敏捷價值觀。排優先順序與決定發布內容是產品負責人的職責,撰寫程式則是開發團隊的工作。",
"產品負責人擁有產品待辦清單,也就是決定專案完成哪些功能。他也負責排定專案、發布、迭代及每日的優先順序,並管理利害關係人的期望。",
"贊助者提供專案目標與財務資源,對產品負責人提供指導,關注產品價值與成本。他不介入日常優先順序與會議促進,那是產品負責人與敏捷教練的工作。",

 ["敏捷宣言認為,下列何者勝於「複雜的文件」?", "可用的軟體", "詳細的合約", "完整的計畫", "嚴格的流程", "價值觀:可用的軟體勝於複雜的文件。"], ["敏捷宣言認為「與客戶協作」勝於:", "合約談判", "團隊溝通", "回應變更", "軟體測試", "價值觀:與客戶協作勝於合約談判。"], ["「回應變更勝於 ____」是敏捷宣言四大價值觀之一。", "遵循計畫", "與客戶協作", "個人與互動", "可用的軟體", "價值觀:回應變更勝於遵循計畫。"], ["敏捷原則的第一優先任務是什麼?", "儘早且持續交付有價值的成果以滿足客戶", "降低人事成本", "完成所有文件", "完全避免需求變更", "這是第 1 條原則。"], ["當客戶在開發後期提出需求變更時,依敏捷原則應如何處理?", "歡迎改變需求", "一律拒絕", "延到下一個專案", "要求客戶重新簽約後才能討論", "第 2 條:竭誠歡迎改變需求,即使在最後開發階段。"], ["敏捷原則認為,交付可用成果的時間間隔應如何安排?", "以較短的時間間隔為佳", "越長越好", "一律每年一次", "專案結束才交付", "第 3 條:頻率從數週到數月,以較短的時間間隔為佳。"], ["敏捷原則認為,業務人員與開發者在專案進行中應:", "每天一起工作", "每月開會一次", "各自獨立工作", "只透過專案經理聯絡", "第 4 條:業務人員與開發者必須每天一起工作。"], ["敏捷原則認為,團隊成員之間傳遞訊息最有效率與效能的方式為何?", "面對面溝通", "正式公文", "電子郵件", "詳細的工作報告", "第 6 條:面對面的溝通最有效率與效能。"], ["敏捷原則將什麼視為進度的主要測量標準?", "可用的產品、服務或成果", "已完成的文件頁數", "已召開的會議次數", "團隊工作時數", "第 7 條:可用的軟體(成果)是進度的主要測量標準。"], ["「盡最大的可能排除不需要的工作」最符合敏捷原則中的哪一概念?", "精簡", "控制", "標準化", "文件化", "第 10 條:精簡。"], ["敏捷原則認為,最佳的架構、需求及設計來自:", "自我組織的團隊", "高階主管", "外部顧問", "專案管理辦公室", "第 11 條:來自能自我組織的團隊。"], ["某敏捷團隊每隔一段時間便檢討「怎樣工作可以更有效率」,並據此修改下一階段的工作方式。這最符合哪一項敏捷原則?", "團隊定期自省並調整與修正行為", "遵循原始計畫", "加強合約談判", "增加專案文件", "第 12 條:團隊定期自省並調整與修正行為,即回顧。"], ["下列何者「不是」簡報所列採用敏捷可達成的五項主要商業目標?", "完全消除市場風險", "可持續創新", "產品有彈性", "加速上市時間", "五項目標不含完全消除市場風險。"], ["敏捷為何可能增加投資報酬率(ROI)?", "根據市場價值開發小批迭代產品,儘快上市與快速回收", "延後產品上市", "增加產品文件", "減少與客戶接觸", "小批量交付可儘快上市並快速回收成本,提高 ROI。"], ["組織專案管理(OPM)的主要目的為何?", "透過專案相關管理實務達成組織策略", "讓每個專案完全獨立於組織策略", "只負責軟體開發", "只管理日常營運", "OPM 以組織策略為基礎,應用專案組合、專案集與專案來達成策略。"], ["OPM3 中的「SMCI」四個成熟度測評等級,正確順序為何?", "Standardize → Measure → Control → Improve", "Structure → Manage → Control → Innovate", "Standardize → Manage → Create → Improve", "Strategy → Measure → Control → Integrate", "SMCI = 標準化、可衡量、可控制、持續改進。"], ["下列關於「專案組合(Portfolio)」與「專案集(Program)」的敘述,何者正確?", "Portfolio 可包含專案、專案集、子專案組合及日常營運工作", "Portfolio 只能包含單一專案", "Program 是一群彼此完全無關的專案", "Program 與組織策略完全無關", "專案集是一群相關的專案,且兩者都需符合組織策略。"], ["下列哪一項不是「敏捷原則」(Agile Principle)?", "經常交付可用的成果,頻率可從數週到數個月,以較長的時間間隔為佳", "專案靠積極的個人來完成,給予他們所需的環境與支援,並相信他們可以完成工作", "敏捷流程提倡穩定持續的開發,發起人、開發者及用戶都應該能不斷地維持穩定的步調", "精簡—精髓是要盡最大的可能,排除不需要做的工作", "原則是以較短的時間間隔為佳。"], ["下列對敏捷原則中「精簡(Simplicity)」的敘述,哪一項正確?", "是要盡最大的可能,排除不需要做的工作", "是要盡最小的可能,排除不需要做的工作", "是要盡最大的可能,排除需要做的工作", "是要盡最小的可能,排除需要做的工作", "精簡是盡最大可能排除不必要的工作。"], ["下列哪一項不是「敏捷原則」(Agile Principle)?", "最佳的架構、需求及設計皆來自於能有效監控的團隊", "可用的軟體是進度的主要量測標準", "持續專注於追求卓越的技術與優良的設計以強化敏捷力", "團隊定期自省應如何更有效率,並據以適當地調整與修正行為", "原則是來自能自我組織的團隊,不是有效監控的團隊。"], ["根據「敏捷原則」,下列哪一項是進度的主要量測標準?", "可用的軟體", "大量的文件", "好的架構", "充分授權的工作環境", "第 7 條原則。"], ["根據「敏捷原則」,最佳的架構、需求及設計皆來自於下列哪一項?", "能自我組織的團隊", "產品負責人(Product Owner)", "敏捷教練(Coach)", "專案經理", "第 11 條原則。"]];
var Q3=[["螺旋模式每個循環的四個步驟,順序為何?", "決定目標→識別與解決風險→開發與測試→規劃下個循環", "開發與測試→決定目標→識別與解決風險→規劃下個循環", "規劃下個循環→決定目標→開發與測試→識別與解決風險", "識別與解決風險→決定目標→規劃下個循環→開發與測試", "螺旋模式四象限:決定目標、識別與解決風險、開發與測試、規劃下個循環。"], ["根據資訊系統開發模式演進圖,下列哪一個模式最早提出(1970 年)?", "瀑布模式", "漸進模式", "雛型模式", "螺旋模式", "瀑布模式由 Royce 於 1970 年提出;漸進模式 1972、雛型模式 1977、螺旋模式 1988。"], ["若開發團隊將雛型系統視為最終產品,最可能造成什麼後果?", "犧牲產品品質", "客戶滿意度提高", "需求更完整", "文件更齊全", "雛型模式的缺點之一:團隊把雛型當成最終產品而犧牲品質,且系統文件較不完備。"], ["RUP 模式以什麼作為系統開發的首要工作,以便更精確了解使用者需求?", "企業塑模", "程式撰寫", "部署", "測試", "RUP 以企業塑模為首要工作,讓開發者更精確了解使用者需求。"], ["下列何者符合瀑布模式的特性?", "各階段工作人員須完成正確、完整、易讀的文件,移交給下一階段", "各階段可以同時並行進行", "專案資源配置以客戶需求變動為基礎", "客戶全程密集參與開發過程", "瀑布模式講求階段文件與移交,資源以生命週期各階段為基礎,客戶參與不足。"], ["下列何者「不是」Scrum 的基本價值觀?", "檢視", "公開", "專注", "承諾", "Scrum 五個基本價值觀是公開、勇氣、尊重、專注、承諾;檢視是三大支柱之一。"], ["Scrum 是由誰在何時共同提出的?", "Ken Schwaber 與 Jeff Sutherland 於 1995 年", "Kent Beck 於 1999 年", "Alistair Cockburn 於 2001 年", "Jeff De Luca 於 1997 年", "Scrum 由 Ken Schwaber 與 Jeff Sutherland 於 1995 年在 OOPSLA 研討會共同提出。"], ["下列何者「不是」瀑布模式的缺點?", "各階段的產出都須經過確認、驗證及測試,藉此發現品質缺失並改善", "專案開始時必須完整且清楚地描述所有需求", "客戶要到專案末期才能看到產品", "各階段的改變或錯誤須回溯到前一階段,並經冗長的審查簽核", "階段產出需確認、驗證及測試是瀑布模式的特性(優點);其餘三項都是缺點。"], ["下列何者是 RUP 模式的缺點?", "模式過於繁雜,企業學習與導入困難,且支援工具受限於 IBM Rational 軟體", "缺乏視覺化模型", "無法迭代", "不重視需求分析", "RUP 的缺點是過於繁雜、工具受限於 IBM Rational;它其實有視覺化模型、採迭代且重視企業塑模。"], ["下列何者「不是」Scrum 的儀式?", "燃盡圖", "衝刺規劃", "衝刺審查", "衝刺回顧", "四個正式儀式是衝刺規劃、每日立會、衝刺審查、衝刺回顧;燃盡圖是 Scrum 的產出。"], ["瀑布模式的標準開發流程順序為何?", "需求→設計→開發→測試→部署", "設計→需求→開發→測試→部署", "需求→開發→設計→部署→測試", "需求→設計→測試→開發→部署", "瀑布流程依序為需求、設計、開發、測試、部署。"], ["下列何者是漸進模式的缺點?", "需要對每個漸進階段做清楚完整的定義,可能使系統開發期程變長", "無法分階段編列預算", "風險管理成本過高", "完全沒有文件可供維護", "漸進模式需為每個階段完整定義,期程可能變長;能分階段編列預算反而是它的優點。"], ["雛型模式屬於客戶導向的分析與設計,但可能遇到什麼問題?", "大部分時間客戶並不清楚他們真正的需求是什麼", "客戶參與度過低", "開發團隊不願意修改系統", "專案一開始就能精確估算完成時間", "簡報指出客戶往往不清楚真正需求,且團隊也難以掌握完成可接受產品所需的時間。"], ["螺旋模式是由哪位學者於哪一年提出?", "Barry,1988", "Royce,1970", "Bally et al.,1977", "Booch,1999", "螺旋模式為 Barry 於 1988 年提出;Royce 是瀑布、Bally 是雛型、Booch 是 RUP。"], ["瀑布模式的風險與失敗成本偏高,主要原因為何?", "專案較後階段才開始進行開發", "專案初期過度簡化需求" 獨自的需求、分析、設計、開發、測試流程", "因為不需要測試", "因為只做核心功能", "因為客戶不參與", "漸進模式每個階段都像一次小型瀑布流程,所以總成本通常較高。"], ["下列何者是螺旋模式的缺點?", "過分依賴風險分析的經驗與技術,分析若出現偏差將造成重大損失", "無法建立雛型", "不重視軟體測試", "客戶無法提供回饋", "螺旋模式倚重風險分析,偏差會造成重大損失。"], ["下列何者「不是」Scrum 團隊的組成角色?", "專案經理", "產品負責人(PO)", "開發團隊", "Scrum 大師", "Scrum 團隊由產品負責人、開發團隊、Scrum 大師組成。"], ["下列何者「不是」Scrum 的基本價值觀?", "檢視", "公開", "專注", "承諾", "價值觀為公開、勇氣、尊重、專注、承諾;檢視是支柱。"], ["下列哪一項最符合 Scrum 的定義?", "讓團隊關注於「在最短時間內交付最高商業價值產品」的框架", "一套詳細規定所有文件格式的重量級流程", "以一次完整交付為目標的開發方法", "專門用於測試階段的管理工具", "Scrum 是輕量框架,聚焦在最短時間內交付最高商業價值。"], ["下列何者「不是」RUP 的九大工作流程之一?", "風險分析", "企業塑模", "組態管理與變更管理", "環境", "RUP 九大工作流程:企業塑模、需求、分析與設計、實作、測試、部署、組態與變更管理、專案管理、環境。"], ["由 Kent Beck 創建,專注於敏捷開發實務,強調效率、聚焦客戶、回饋及品質的是哪一種方法論?", "終極編程(XP)", "Scrum", "精益(Lean)", "看板(Kanban)", "XP 由 Kent Beck 等人創建。"], ["下列何者是 Scrum 的三大支柱之一?", "透明", "承諾", "勇氣", "尊重", "三大支柱是透明、檢視、調適;其餘為價值觀。"], ["下列何者符合瀑布模式的特性?", "各階段工作人員須完成正確、完整、易讀的文件,移交給下一階段", "各階段可以同時並行進行", "專案資源配置以客戶需求變動為基礎", "客戶全程密集參與開發過程", "瀑布模式講求階段文件與移交。"], ["漸進模式的第一個漸進階段(漸進一)建置的是什麼?", "核心功能", "功能一", "所有功能的雛型", "部署與教育訓練", "漸進一建置核心功能。"], ["RUP 採用迭代式開發,主要優點為何?", "每次迭代中能及早發現問題,降低開發風險", "完全不需要文件", "不需要專案管理", "可以省略測試", "迭代式開發可及早發現問題,降低風險。"], ["在 Scrum 流程中,一個衝刺(Sprint)與每日立會的週期分別為何?", "衝刺約 2–4 週,每日立會每 24 小時一次", "衝刺約 6 個月,每日立會每週一次", "衝刺約 1 天,每日立會每月一次", "衝刺約 3 個月,每日立會每 24 小時一次", "衝刺 2–4 週,每日立會每天一次。"], ["雛型模式較不適用於哪一類專案?", "大型及多人參與的系統開發專案", "小型專案", "需要快速確認需求的專案", "使用者介面導向的專案", "雛型缺乏整體規劃,較不適用於大型多人專案。"], ["RUP 模式的四個階段為何?", "初始、詳述、建構、轉移", "需求、設計、開發、測試", "構想、推測、探索、調整", "決定目標、風險分析、開發、規劃", "RUP 四階段:初始、詳述、建構、轉移。"], ["哪一種敏捷方法論的重點是「精簡與流程最佳化」,強調減少無法創造客戶價值的工作?", "精益(Lean)", "DSDM", "FDD", "Crystal", "精益強調消除浪費、減少無法創造客戶價值的工作。"], ["為什麼螺旋模式「不利於已簽署合約的客戶與開發者之間的協調」?", "因為開發流程過於靈活", "因為文件過於繁雜", "因為工具受限於特定廠商", "因為客戶完全不參與", "螺旋模式流程過於靈活,不利於已簽約客戶與開發者協調。"], ["下列敏捷方法論與創建者的配對,何者正確?", "看板(Kanban)— David J. Anderson", "Scrum — Kent Beck", "功能驅動開發(FDD)— Alistair Cockburn", "水晶家族(Crystal)— Jeff De Luca", "看板為 David J. Anderson;Scrum 為 Schwaber 與 Sutherland;FDD 為 Jeff De Luca;水晶家族為 Alistair Cockburn。"], ["螺旋模式是由哪位學者於哪一年提出?", "Barry,1988", "Royce,1970", "Bally et al.,1977", "Booch,1999", "螺旋模式由 Barry 於 1988 年提出。"], ["雛型模式屬於客戶導向的分析與設計,但可能遇到什麼問題?", "大部分時間客戶並不清楚他們真正的需求是什麼", "客戶參與度過低", "開發團隊不願意修改系統", "專案一開始就能精確估算完成時間", "客戶往往不清楚真正需求。"], ["瀑布模式的標準開發流程順序為何?", "需求→設計→開發→測試→部署", "設計→需求→開發→測試→部署", "需求→開發→設計→部署→測試", "需求→設計→測試→開發→部署", "瀑布流程:需求、設計、開發、測試、部署。"], ["瀑布模式的風險與失敗成本偏高,主要原因為何?", "專案較後階段才開始進行開發", "專案初期過度簡化需求", "客戶參與過多", "各階段不需要審查簽核", "開發較晚才開始,錯誤到後期才發現,風險與失敗成本偏高。"], ["雛型模式強調的重點是什麼?", "雛型的快速開發及使用者高度參與", "風險分析與風險管理", "完整的分析設計文件", "以企業塑模為首要工作", "雛型模式強調快速開發雛型與使用者高度參與。"], ["下列何者是漸進模式的優點?", "預算編列、付款、系統測試及教育訓練可分階段進行,降低財務與失敗風險", "總開發成本一定低於瀑布模式", "不需要對每個漸進階段做完整定義", "各漸進階段之間高度關聯、容易整合", "漸進模式可分階段編列預算、付款與測試,降低財務與失敗風險。"], ["下列何者「不是」Scrum 的三大屬性?", "文件嚴謹", "輕量的", "簡單易懂", "難以精通", "Scrum 三大屬性:輕量的、簡單易懂、難以精通。"], ["在瀑布模式中,一個階段的結束代表什麼意義?", "專案管理的里程碑,據以決定是否進入下一階段", "專案正式結束", "必須重新蒐集需求", "客戶必須完成驗收並付款", "階段結束是專案管理的里程碑。"], ["下列何者「不是」瀑布模式的缺點?", "各階段的產出都須經過確認、驗證及測試,藉此發現品質缺失並改善", "專案開始時必須完整且清楚地描述所有需求", "客戶要到專案末期才能看到產品", "各階段的改變或錯誤須回溯到前一階段,並經冗長的審查簽核", "階段產出需確認、驗證與測試是瀑布模式的特性,其餘為缺點。"], ["下列何者「不是」Scrum 的儀式?", "燃盡圖", "衝刺規劃", "衝刺審查", "衝刺回顧", "四個儀式:衝刺規劃、每日立會、衝刺審查、衝刺回顧;燃盡圖是產出。"], ["下列何者是 RUP 模式的缺點?", "模式過於繁雜,企業學習與導入困難,且支援工具受限於 IBM Rational 軟體", "缺乏視覺化模型", "無法迭代", "不重視需求分析", "RUP 的缺點是過於繁雜且工具受限於 IBM Rational;它其實有視覺化模型、可迭代且重視需求。"], ["下列何者是漸進模式的缺點?", "需要對每個漸進階段做清楚完整的定義,可能使系統開發期程變長", "無法分階段編列預算", "風險管理成本過高", "完全沒有文件可供維護", "漸進模式需為每個階段完整定義,期程可能變長。"], ["雛型模式強調以「雛型演進」代替完整的分析與設計,會導致什麼缺點?", "系統文件較不完備,後續程式維護相對困難", "開發成本大幅降低", "客戶無法參與需求溝通", "無法快速滿足使用者需求", "雛型演進取代完整分析設計,文件較不完備,日後維護較困難;影片中此題曾選 D 為錯誤答案。"], ["若組織希望員工能充分熟悉與接受新系統,並有充分時間學習與技術移轉,較適合採用哪一種模式?", "漸進模式", "瀑布模式", "雛型模式", "螺旋模式", "漸進模式分階段建置,員工有充分時間學習。"], ["根據資訊系統開發模式演進圖,下列哪一個模式最早提出(1970 年)?", "瀑布模式", "漸進模式", "雛型模式", "螺旋模式", "瀑布模式由 Royce 於 1970 年提出。"], ["螺旋模式每個循環的四個步驟,順序為何?", "決定目標→識別與解決風險→開發與測試→規劃下個循環", "開發與測試→決定目標→識別與解決風險→規劃下個循環", "規劃下個循環→決定目標→開發與測試→識別與解決風險", "識別與解決風險→決定目標→規劃下個循環→開發與測試", "螺旋模式四象限:決定目標、識別與解決風險、開發與測試、規劃下個循環(正確答案為 B)。"]];
var Q6=[["判斷團隊是否實踐敏捷,最主要的依據是什麼?", "是否符合敏捷的4個價值觀與12項原則", "是否使用指定的專案管理軟體", "是否完全取消專案文件", "是否每天變更工作目標", "判斷是否實踐敏捷,看的是否符合敏捷四個價值觀與十二項原則,而不是工具或形式。"], ["APMF敏捷專案管理架構的核心目的為何?", "協助團隊將專案的商業價值最大化", "讓所有專案採用相同的工作流程", "將專案文件數量降至最低", "將專案決策集中於主管", "APMF 的核心目的是協助團隊將專案商業價值最大化。"], ["敏捷專案管理是哪兩種管理方式的融合與協調?", "科學化管理與人性化管理", "財務管理與行銷管理", "集權管理與行政管理", "品質管理與設備管理", "敏捷專案管理融合科學化管理與人性化管理。"], ["APMF架構以哪四個面向說明專案的運作?", "參與人員、階段、工作事項、產出", "成本、品質、採購、風險", "需求、設計、開發、維護", "願景、預算、績效、獎酬", "APMF 以參與人員、階段、工作事項、產出四個面向說明專案運作。"], ["敏捷專案在一開始應如何規劃?", "先做大方向規劃,再逐步細化", "完成全部需求細節後才核准專案", "預先固定所有迭代的工作細節", "等第一次發布後才建立專案方向", "敏捷採漸進明細:先有大方向,再逐步細化。"], ["敏捷專案每次發布增量成果後,取得客戶回饋的主要用途為何?", "修改本次產品,並調整後續規劃", "作為延後驗收的依據", "證明原始規劃不需調整", "取代後續所有測試活動", "客戶回饋用來修改產品並調整後續規劃。"], ["下列哪一項工作屬於「可行性分析階段」?", "準備營運企劃案與核准專案", "開發並測試增量成果", "進行每日立會", "進行迭代回顧", "可行性分析階段的工作是準備營運企劃案與核准專案。"], ["「產品盒、願景卡」主要對應下列哪一項工作?", "建立專案共同的願景", "估算用戶故事點數", "準備驗收測試案例", "結束專案活動", "產品盒與願景卡用來建立專案共同願景。"], ["下列何者是「起始階段」的工作?", "建立產品地圖", "進行發布回顧", "交付最終專案成果", "開發本次迭代的增量成果", "建立產品地圖屬起始階段工作。"], ["敏捷專案章程包含下列哪兩項內容?", "專案章程與團隊章程", "採購契約與保固契約", "測試案例與測試報告", "發布紀錄與驗收紀錄", "敏捷專案章程包含專案章程與團隊章程。"], ["起始階段所產出的「角色卡」,主要用於什麼目的?", "更詳細地描述利害關係人", "記錄每日出勤情形", "計算成員績效獎金", "取代產品待辦清單", "角色卡用來更詳細地描述利害關係人。"], ["下列哪一項屬於「發布循環階段」的工作?", "分解用戶故事並定義驗收標準", "首次核准專案", "建立最初的專案共同願景", "結束所有專案活動", "分解用戶故事並定義驗收標準屬發布循環階段。"], ["在發布循環中,「刺探」(Spike)的用途為何?", "蒐集下一迭代用戶故事的細節資料", "決定團隊成員的升遷順序", "取消尚未完成的所有需求", "取代發布回顧會議", "刺探用來蒐集用戶故事的細節資料。"], ["下列哪一項是迭代循環子階段的產出?", "通過驗收測試的增量成果", "營運企劃案", "專案核准文件", "產品盒與願景卡", "迭代循環的產出是通過驗收測試的增量成果。"], ["專案結束階段應進行下列哪一項活動?", "交付專案成果並進行專案回顧", "辨識專案角色", "建立產品待辦清單", "蒐集下一迭代的需求細節", "結束階段要交付專案成果並進行專案回顧。"], ["某次發布包含2次迭代,每次迭代2週。若不另計其他時間,該次發布共需幾週?", "4週", "不一定,視狀況而定", "2週", "8週", "2 次 × 2 週 = 4 週。"], ["下列有關迭代工作方式的描述,何者正確?", "在迭代內同步進行分析、設計、寫程式與測試", "第一個迭代負責分析,最後一個迭代負責測試", "程式都撰寫完成之時,就是測試者開始加入團隊的時間", "所有發布結束後,才進行產品測試", "敏捷在每個迭代內同步進行分析、設計、寫程式與測試。"], ["下列關於「時間盒」(Time Boxing)主要意義的敘述,何者正確?", "將專案、發布、迭代與會議限制在固定時間內", "由成員自行決定何時結束所有工作", "只記錄工作時間,不設定完成期限", "因為是個黑盒子,方便工作未完成時,可延長原定週期", "時間盒是把專案、發布、迭代與會議限制在固定時間內。"], ["依照業界最佳工作實務,每日立會的時間,一般設定為多久?", "15分鐘", "5分鐘", "45分鐘", "60分鐘", "每日立會一般設定為 15 分鐘。"], ["當一個迭代內的用戶故事工作都完成後,應接著進行什麼?", "進行迭代審查與回顧", "直接開始下一個迭代", "立即結束整個專案", "重新進行專案可行性分析", "迭代工作完成後進行迭代審查與回顧。"], ["下列哪一種描述最符合敏捷團隊的定義?", "充分授權、自我組織的跨職能團隊", "由主管逐項分派工作的單一專業團隊", "不需要與客戶溝通的獨立團隊", "由個別成員各自完成工作的臨時集合", "敏捷團隊是充分授權、自我組織的跨職能團隊。"], ["團隊成員主動從待辦清單中拿取適合的工作,而非等待主管指派,主要展現哪一項特質?", "自律", "會議紀律", "團隊競爭", "績效考核機制", "主動承接工作展現的是自律。"], ["「共同分擔責任」最適合以下哪一種行為呈現?", "成員共同制定並承諾計畫,互相協助完成任務", "制定層層負責的階層式管理制度", "由敏捷教練和專案負責人共同承諾所有工作", "將工作落後的責任交由客戶承擔", "共同分擔責任是成員共同承諾並互相協助。"], ["團隊將規劃、流程、決策及迭代狀況以圖表展示在牆上,主要是為了什麼?", "提高透明度,協助及早發現問題", "減少成員參與決策的機會", "取代團隊成員之間的所有討論", "讓主管能完全控制每個人的工作方式", "資訊圖表展示牆的目的是提高透明度並及早發現問題。"], ["敏捷團隊如何兼顧靈活性與公司標準?", "在公司制度與標準下,允許靈活選擇合適的工作方式", "因為敏捷團隊是自我組織的團隊,所以可不遵守公司制度,較具靈活性", "取消公司標準,額外建立團隊規則", "所有團隊都必須採用完全相同的工作細節", "應在公司制度與標準下,彈性選擇合適的工作方式。"], ["依據APMF的團隊範圍說明,下列哪組角色位於敏捷團隊外圈,雖非團隊成員,卻對專案影響重大?", "贊助者與利害關係人", "產品負責人與敏捷教練", "團隊成員與測試者", "敏捷教練與測試者", "贊助者與利害關係人位於團隊外圈。"], ["「利害關係人」是指?", "參與專案、受專案影響,或可能影響專案的個人與組織", "提供經費的個人或組織", "參與程式開發的個人或組織", "專案成果的最終購買者", "利害關係人是參與、受影響或能影響專案的個人與組織。"], ["敏捷專案管理與傳統專案管理最大的不同為何?", "將客戶或利害關係人代表納入敏捷團隊", "敏捷專案不需要管理利害關係人", "敏捷專案沒有時間與資源限制", "工作主要交由產品負責人執行", "敏捷把客戶或利害關係人代表納入團隊。"], ["開發團隊通常具有下列哪一項特徵?", "通常少於12人,並具有跨職能特性", "人數越多越好,工作比較容易快速做完", "所有人都必須精通每一種工作", "團隊成員最好都擁有同樣專長,比較好溝通", "開發團隊通常少於 12 人且具跨職能特性。"], ["「通用專家」(Generalizing Specialists)的意義為何?", "成員擁有多項專精,能互相支援,但不必樣樣精通", "對所有工作都有認識,但沒有任何專長", "每位成員都必須精通全部專業領域", "每位成員只能從事一種固定工作", "通用專家擁有多項專精、能互相支援,但不必樣樣精通。"], ["團隊成員依專長選取待辦清單最上方的工作,主要考量為何?", "優先選擇對客戶價值最高的工作", "優先選擇最容易完成的工作", "優先選擇主管最熟悉的工作", "優先選擇不需要合作的工作", "取用待辦清單頂端的高價值工作,以客戶價值為優先。"], ["關於敏捷教練的工作,下列哪個說法較正確?", "協助團隊自我組織、建立信任並移除障礙", "代替產品負責人決定所有產品功能", "負責決定工作待辦清單中各工作的優先順序", "負責處理團隊問題", "敏捷教練協助團隊自我組織、建立信任並移除障礙。"], ["「流程裁適」(Process Tailoring)是指什麼?", "根據企業需求,從一般性框架中挑選並整合適合的流程", "所有企業一律採用相同的完整流程", "根據總裁的決定來調整企業流程", "將企業需求調整成完全符合既定流程", "流程裁適是依需求從一般性框架挑選整合適合的流程。"], ["下列哪一項是產品負責人/客戶的主要責任?", "擁有產品待辦清單,決定工作內容與優先順序", "提供全部專案財務資源", "親自執行所有開發與測試工作", "代替所有成員選擇每日工作的技術方法", "產品負責人擁有產品待辦清單,決定工作內容與優先順序。"], ["下列哪一項是贊助者的主要工作?", "提供專案目標與財務資源,關注產品價值及成本", "撰寫所有驗收測試案例", "每日逐一指派開發人員的工作", "取代產品負責人維護每張用戶故事卡", "贊助者提供專案目標與財務資源,並關注價值及成本。"], ["從傳統領導轉向僕人式領導時,領導者應進行哪一項主要轉變?", "從親自解決問題轉向提倡授權與協助成員成長", "從協助團隊轉向加強命令控制", "從授權成員轉向集中所有決策", "從關注成長轉向只關注個人績效", "僕人式領導重授權與協助成員成長。"], ["當主管從「命令與控制」轉向僕人式領導時,最需要練習的能力為何?", "積極傾聽", "加強監督", "自我反思", "爭取資源", "僕人式領導最需練習積極傾聽。"], ["積極傾聽的有效步驟,依序為何?", "傾聽、瞭解、回應", "傾聽、判斷、回應", "傾聽、分析、考核", "傾聽、瞭解、紀錄", "積極傾聽步驟:傾聽、瞭解、回應。"], ["團隊遇到問題時,下列哪一種回應最符合僕人式領導?", "「你有什麼建議?需要協助時請讓我知道。」", "「你就照著我給你的這個辦法做就可以。」", "「這是你的問題,既是自我組織的團隊,就應自行承擔。」", "「先停止所有工作,等我決定每一個細節。」", "僕人式領導是引導並提供支援,而非命令或放任。"], ["情緒智商(EQ)主要指哪一種能力?", "瞭解與管理情緒、社會互動及人際關係的能力", "快速完成技術工作的能力", "記住團隊所有規章的能力", "以職權壓制不同意見的能力", "EQ 是瞭解與管理情緒、社會互動及人際關係的能力。"], ["下列何者是EQ的四個構面?", "自我察覺、自我管理、社會察覺、人際關係管理", "成本管理、品質管理、採購管理、風險管理", "願景設定、需求分析、程式開發、產品測試", "專業知識、文件寫作、時程安排、預算編列", "EQ 四構面:自我察覺、自我管理、社會察覺、人際關係管理。"], ["團隊規範(Team Norms)應如何建立?", "團隊共同制定工作協定,並一致同意遵守", "由贊助者單方面規定所有工作細節", "等專案結束後,再整理成員習慣", "讓每位成員自行訂定規則,自己管自己", "團隊規範由團隊共同制定並一致同意遵守。"], ["「調適性領導」(Adaptive Leadership)是指?", "依團隊不同發展階段,採用不同領導方式", "調適能力很強的主管", "完全不須領導者就能自行處理所有問題的團隊", "只在專案發生重大失敗後才介入", "調適性領導是依團隊發展階段調整領導方式。"], ["高效能團隊的四個發展階段,正確順序為何?", "建立期、風暴期、規範期、高效期", "建立期、風暴期、高效期、規範期", "規範期、建立期、風暴期、高效期", "建立期、規範期、高效期、風暴期", "團隊發展順序:建立期、風暴期、規範期、高效期。"], ["團隊成員正處於互相挑戰、意見碰撞的階段,最可能是處於高效能團隊發展的哪一期?", "風暴期", "高效期", "規範期", "建立期", "互相挑戰、意見碰撞是風暴期。"], ["團隊成員以事實為基礎分享資訊,並互相合作,屬於哪一個衝突等級?", "第1級「解決問題」", "第2級「不同意」", "第3級「競爭」", "第4級「聖戰」", "第1級是以事實為基礎分享資訊並合作解決問題。"], ["面對第2級「不同意」的衝突,宜採用哪一種管理方式?", "支持並授權每個人解決問題", "立即解散團隊", "停止所有資訊分享", "以法務手段建立安全結構", "第2級衝突宜支持並授權成員自行解決問題。"], ["當團隊成員認為「贏得勝利比解決問題更重要」,且言語出現人身攻擊時,最可能屬於哪一級衝突?", "第3級「競爭」", "第1級「解決問題」", "第2級「不同意」", "第5級「世界大戰」", "重勝利輕問題、出現人身攻擊屬第3級競爭。"], ["面對第4級「聖戰」衝突,應如何處理較好?", "建立安全的結構,並使用外交手段", "只要求成員增加資訊分享即可", "鼓勵各團體持續爭取勝利", "完全不介入,等待衝突自行消失", "第4級衝突需建立安全結構並採外交手段。"], ["第5級「世界大戰」衝突的管理重點為何?", "盡一切必要努力,避免互相傷害", "鼓勵成員繼續辯論立場", "立即進行產品功能排序", "讓雙方各自訂定更高的競爭目標", "第5級衝突重點是避免互相傷害。"], ["下列哪一種溝通方式的效率與效能最高?", "兩人面對面利用白板討論", "僅以紙本文件單向傳遞資訊", "播放影片且不開放問答", "僅透過文字公告傳達決策", "兩人面對面利用白板討論是效率與效能最高的溝通。"], ["「高頻寬溝通」,主要是指什麼?", "面對面的雙向溝通", "使用容量較大的電子郵件附件", "增加每週書面報告的頁數", "使用速度最快的傳輸網路", "高頻寬溝通指面對面的雙向溝通。"], ["工作距離與溝通成本的關係為何?", "距離越遠,溝通成本通常越高", "距離越遠,溝通成本一定越低", "距離不會影響溝通成本", "只有跨國距離才會影響溝通成本", "距離越遠,溝通成本通常越高。"], ["「滲透式溝通」主要是如何發生的?", "成員在共同空間中,透過聆聽周遭對話掌握資訊", "每位成員每天繳交個人報告", "由秘書紀錄詳細會議內容再轉傳給所有團隊成員", "將所有正式公文改成Memo", "滲透式溝通是在共同空間中聽到周遭對話而獲得資訊。"], ["敏捷團隊集中辦公的空間,又可稱為什麼?", "作戰室", "資源中心", "行政中心", "資訊中心", "敏捷團隊集中辦公空間稱為作戰室。"], ["下列何者屬於良好團隊空間配置?", "提供資訊發布站、討論環境與支援工具", "主管辦公室最好不要跟員工的在一起,以免製造壓力", "取消討論環境,避免成員互相干擾", "每人最好都有獨立的一間辦公室", "良好配置提供資訊發布站、討論環境與支援工具。"], ["下列哪一項是遠距團隊的優點?", "能吸納更多人才,並增加文化多樣性", "可以完全避免溝通問題", "不再需要團隊工作協定", "不需要進行任何協同工作", "遠距團隊可吸納更多人才並增加文化多樣性。"], ["為提高遠距團隊的專案成功機會,應該怎麼做較好?", "若條件允許,先共同工作,再分地工作", "開會的時候大家都把攝像頭打開,以利看清楚彼此", "所有成員把文件寫得更仔細一點,以文件取代討論,以利留下證據", "將全部決策交由各地成員自行處理,避免整合困難", "條件允許時先共同工作建立默契,再分地工作。"], ["無論是專案、發布或迭代,敏捷教練在初期、中期與末期應如何安排指導方式?", "初期全隊教練、中期個別教練、末期全隊教練", "初期個別教練、中期全隊教練、末期個別教練", "初期全隊教練、中期全隊教練、末期停止指導", "初期停止指導、中期個別教練、末期個別教練", "初期與末期全隊教練,中期個別教練。"], ["下列哪一個問題最適合在每日立會中提出?", "「目前有什麼問題或阻礙會影響你的工作進展?」", "「公司明年的整體組織架構要如何調整?」", "「下一個年度應採用哪一種領導理論?」", "「整個專案結束後應如何分配獎金?」", "每日立會聚焦工作進展與阻礙。"], ["某團隊準時完成所有原訂功能,但客戶認為這些功能已不符合目前的營運需要。依APMF的核心理念,最適當的判斷為何?", "團隊應重新檢視專案願景與商業價值,據以調整後續工作", "準時完成原訂功能,就代表專案已達成最高價值", "問題完全來自客戶,因不再當初的合約裡,所以不需要調整專案管理方式", "增加測試次數,以確保功能符合客戶目前需要", "APMF 重視商業價值,應重新檢視願景並調整後續工作。"], ["某公司導入敏捷時,要求每個部門完全照搬同一套流程,不得調整。依你對敏捷的了解,你覺得應該要採取下列哪一項建議做調整會比較恰當?", "維持敏捷價值觀與原則,再依組織文化及需求裁適流程", "尊重成員的意願,必要時可取消或更動敏捷價值觀與原則無妨", "將所有流程改為個人自行決定,不需要共同架構", "先固定工具,再要求所有專案改變目標以配合工具", "價值觀與原則不變,流程依組織需求裁適。"], ["某團隊在第一次發布後收到客戶回饋,只修正已交付的功能,卻不調整後續規劃。此做法最主要忽略了什麼?", "回饋也應用於修正後續規劃,落實漸進明細", "發布後應立即結束專案", "客戶回饋只能用於最終驗收", "後續規劃只能由贊助者更動", "回饋應同時用於修正後續規劃,落實漸進明細。"], ["某專案尚未確認共同願景與商業論證,就開始進行詳細的用戶故事點數估算。依APMF階段安排,最應優先補足哪一項工作?", "完成可行性分析所需的願景、營運企劃案與專案核准", "準備所有迭代的驗收測試案例", "進行專案結束回顧", "決定每日立會的發言順序", "應先完成可行性分析所需的願景、營運企劃案與核准。"], ["團隊正在建立角色卡、進行高階估算,並繪製產品地圖。這組工作最可能屬於APMF的哪一階段?", "起始階段", "可行性分析階段", "結束階段", "迭代審查階段", "角色卡、高階估算與產品地圖屬起始階段。"], ["某團隊已準備展開下一迭代,但對其中一項用戶故事的細節仍不清楚。在這種狀況下,最適合運用哪一項活動補足資料?", "刺探(Spike)", "可行性分析", "迭代審查", "迭代回顧", "用戶故事細節不清楚時,用刺探蒐集細節。"], ["某團隊準備依下列順序進行工作:①迭代規劃、②開發與測試增量成果、③迭代審查與回顧、④下一迭代規劃。下列敘述何者正確?", "此順序能讓團隊將本次檢視與回顧的發現帶入下一次規劃", "應將③移至整個專案結束後才進行", "應取消②中的測試,留到迭代完成後才進行", "應先完成④,才可討論本次迭代的改進事項", "先審查回顧再規劃下一迭代,可把發現帶入下一次規劃。"], ["某團隊每兩週完成一次迭代,但從未將成果交付客戶。團隊宣稱:「只要持續迭代,就已充分實現敏捷。」你身為敏捷專案經理,你的看法是?", "仍應透過發布交付有價值的增量成果,並取得客戶回饋", "正確,迭代是敏捷最重要的核心,有持續迭代即可", "正確,客戶只需在最後專案最終驗收時滿意即可", "應取消迭代,改為一次完成全部成果", "敏捷要透過發布交付價值並取得客戶回饋。"], ["某次發布包含3次迭代,每次迭代2週。團隊規劃連續進行2次相同安排的發布。若不另計其他時間,總共需要多久?", "12週", "6週", "8週", "10週", "3 × 2 = 6 週,兩次發布共 12 週。"], ["團隊預計在下一次規劃前,先討論本次合作方式與流程有哪些地方可以改善。下列哪一組「活動與產出」最符合此目的?", "回顧會議與改進行動方案", "可行性分析與產品盒", "角色辨識與角色卡", "高階估算與產品地圖", "回顧會議的產出是改進行動方案。"], ["團隊成員表示:「自我組織就是每個人各做各的,完成自己的部分就好。」下列哪一項最能指出此說法的問題?", "自我組織仍要求共同承諾、分擔責任及互相支援", "自我組織要求所有工作都由主管指派", "自我組織表示不需要與客戶溝通", "自我組織只適用於沒有共同目標的工作", "自我組織仍需共同承諾、分擔責任與互相支援。"], ["某成員已完成自己的工作,但另一位成員的高優先工作遇到困難。在此情況下,最符合敏捷團隊精神的做法為何?", "在能力範圍內提供支援,協助團隊完成共同承諾", "優先挑選較容易完成的低價值工作,增加個人完成件數", "等敏捷教練下令後,才考慮是否協助", "將困難工作退回產品負責人,要求他親自完成", "敏捷團隊共同承諾,成員會互相支援。"], ["某開發人員認為高商業價值的工作較困難,因此只挑選清單底部自己熟悉的工作。針對這種情況,最適當的調整方式為何?", "依專長優先承接高價值工作,必要時與其他成員合作", "只要個人工作速度快,就不需要考慮清單排序", "將所有困難工作保留到專案最後處理", "由贊助者取代開發人員完成困難工作", "應優先承接高價值工作,必要時與他人合作。"], ["某公司認為「通用專家」代表每個人都必須精通所有技術,才能加入敏捷團隊。針對這個說法,下列哪一項修正最適當?", "成員應具備多項專精並能互動,但不必樣樣精通", "成員完全不需具備專長,只需願意參與", "成員應只保留一項專長,以免分散注意力", "團隊只需要一位精通全部工作的成員,其餘人員不需學習", "通用專家是多項專精並能互相支援,不必樣樣精通。"], ["某團隊允許成員自行安排工作,但要求所有人完全照主管指定的方式執行,且不得提出改進。這種情況反應的是?", "此安排削弱了自我組織與團隊改善工作方式的空間", "此安排充分落實了自下而上的智慧", "只要成員能自行選擇上班時間,就代表充分授權", "敏捷團隊本來就不應參與流程決策", "不得提出改進,削弱了自我組織與改善工作方式的空間。"], ["產品負責人長期無法聯繫,且對需求優先順序沒有決策權。這最可能造成哪一項問題?", "團隊難以及時確認工作方向,並將生產力轉換為價值", "團隊可以因此省略所有需求確認", "敏捷教練自然取得所有產品決策權", "贊助者不再需要關注產品價值", "產品負責人缺位,團隊難以確認方向並把產能轉為價值。"], ["多位主管分別要求團隊優先處理自己的需求,導致工作順序互相衝突。最適當的處理方式為何?", "由產品負責人整合需求,依商業價值排定優先順序", "讓每位開發人員自行選擇要聽從哪位主管", "以提出需求者的職級決定優先順序", "將所有需求設為最高優先,要求團隊同時完成", "由產品負責人整合需求並依商業價值排序。"], ["下列哪一組分工最符合敏捷團隊的運作方式?", "產品負責人決定做什麼及順序,敏捷教練協助團隊合作與排除障礙", "贊助者決定所有技術細節,測試者決定產品價值", "敏捷教練提供全部經費,產品負責人移除所有組織障礙", "開發團隊決定全部產品優先順序,產品負責人執行每日測試", "產品負責人決定內容與順序,敏捷教練協助合作並排除障礙。"], ["當某專案發生跨部門資源障礙,團隊成員無法自行排除時,敏捷教練該做什麼?", "協助移除障礙,必要時與贊助者或發起人協調", "要求成員在沒有資源的情況下照原計畫完成", "直接取消產品負責人的需求決策權", "將問題留到專案結束時再討論", "教練協助移除障礙,必要時向贊助者協調。"], ["贊助者認為已提供經費,因此不需要參加任何成果審查。你做為資深敏捷經理,你的建議是?", "應參加發布與迭代審查,了解增量成果及其價值", "同意,出錢的是大爺,他提供財務資源後本就不需再參與", "應改為每日透過產品負責人替所有成員指派工作", "只需檢查工時紀錄,不需檢視成果", "贊助者應參與審查,了解增量成果與價值。"], ["團隊詢問敏捷教練應如何解決某項問題。下列哪一項回應最能同時展現授權與支持?", "「你們認為有哪些可行方法?需要哪些資源或協助?」", "「等我找出唯一正確的答案,你們再開始。」", "「你們自己決定,我不干預。」", "「先照過去的方法試試看。」", "引導團隊思考方法並提供資源,兼顧授權與支持。"], ["一個總是幫團隊做所有決策、自稱採取僕人式領導的主管,其最主要的問題為何?", "持續代替團隊思考,限制成員自主決策與成長", "提供協助過少,應增加命令次數", "沒有要求團隊取消共同願景", "未將全部問題轉交贊助者處理", "代替團隊做所有決策,限制自主決策與成長。"], ["在討論衝突時,敏捷教練先完整聽取成員說法,再確認自己是否理解,最後提出回應。此做法最符合哪一項概念?", "積極傾聽", "流程裁適", "高階估算", "角色辨識", "先傾聽、瞭解再回應,就是積極傾聽。"], ["某成員察覺自己因進度落後而焦躁,並主動調整表達方式,避免將情緒發洩在同事身上。此情境主要結合哪兩項EQ能力?", "自我察覺與自我管理", "社會察覺與自我管理", "社會察覺與積極傾聽", "人際關係管理與情緒控制", "察覺自己情緒是自我察覺,調整表達是自我管理。"], ["團隊規範由所有成員共同同意,但有一位資深成員主張自己不必遵守。這時,最適當的處理原則為何?", "共同制定的基本原則適用於全體團隊成員", "因為他夠資深,可讓他自行決定是否適用", "本就只有新進人員需要遵守團隊規範", "團隊規範只供參考,不應影響行為", "團隊規範適用全體成員。"], ["某主管不論團隊處於建立期或高效期,都採用完全相同的指導方式。他最應補強哪一項能力?", "調適性領導", "多角化經營", "積極傾聽", "APMF", "應依團隊發展階段調整領導方式,即調適性領導。"], ["某團隊的成員原本互相挑戰,後來逐漸建立共同工作方式,開始順利合作。依團隊發展階段,他們最可能是正發生哪一項轉變?", "風暴期轉為規範期", "高效期轉為建立期", "規範期轉為風暴期", "建立期轉為結束期", "從互相挑戰到建立共同工作方式,是風暴期轉為規範期。"], ["團隊成員能以共同目標協調行動,整體運作如同一個合作單位。最接近哪一階段?", "高效期", "建立期", "風暴期", "可行性分析期", "整體如同合作單位是高效期。"], ["兩位成員對方案持不同意見,但仍以事實交換資訊,並願意尋找雙贏結果。此時,最適當的管理方式為何?", "促進合作,持續聚焦問題與雙贏結果", "立即建立隔離結構,禁止雙方接觸", "將雙方視為已進入第5級衝突", "要求其中一方放棄意見,以利專案進行", "屬第1級衝突,應促進合作並聚焦問題。"], ["某次討論逐漸從比較方案,轉為「一定要證明對方能力不足」,並開始出現人身攻擊。此時,最適當的介入方式為何?", "進行調停、談判,並協助取得事實", "只增加書面報告,不處理衝突", "鼓勵雙方持續競爭,直到其中一方認輸", "認定這只是正常資訊分享,不需介入", "已升高為競爭,宜進行調停與談判並協助取得事實。"], ["兩個小組將焦點放在保護自己的團體,並以意識形態標籤指責對方。你判斷這情況是?", "接近第4級衝突,應建立安全結構並採取外交手段", "屬於第1級衝突,應直接放任合作", "屬於第2級衝突,只需分派更多工作", "屬於正常的迭代審查,不需要衝突管理", "保護團體與意識形態指責,接近第4級聖戰。"], ["某團隊衝突升高,雙方以摧毀對方為目標,且幾乎不再交談。此時最優先的處理目標為何?", "避免彼此傷害", "加快下一迭代的點數估算", "增加產品待辦清單的項目", "立即要求雙方共同承諾更多工作",     var g=document.createElement("div");g.className="wg";g.textContent=c.n+"("+w.length+")";L.appendChild(g);
    w.forEach(function(id){var q=c.Q[id];if(!q)return;var d=document.createElement("div");d.className="wi";
      var a=document.createElement("p");a.className="qq";a.textContent=q[0];d.appendChild(a);
      var ul=document.createElement("ul");[q[1],q[2],q[3],q[4]].forEach(function(t,k){var li=document.createElement("li");li.textContent=(k===0?"✔ ":"")+t;if(k===0){li.style.color="var(--ok)";li.style.fontWeight="600"}ul.appendChild(li)});d.appendChild(ul);
      var x=document.createElement("p");x.className="ex";x.textContent="詳解:"+(c.EX[id]||q[5]);d.appendChild(x);
      var r=document.createElement("button");r.className="rm";r.textContent="我學會了,移出錯題本";r.onclick=function(){sv("aq_wrong"+c.k,wOf(ci).filter(function(v){return v!==id}));wbPage()};d.appendChild(r);L.appendChild(d)})});
  if(fw){var g2=document.createElement("div");g2.className="wg";g2.textContent="🧩 流程圖填空("+fw+" 格)";L.appendChild(g2);
    var rb=document.createElement("button");rb.className="ghost";rb.textContent="重做這些填空";rb.onclick=function(){fillReset("wrong");viewC=-3;home();window.scrollTo(0,0)};L.appendChild(rb);
    fwk.forEach(function(k){var b=FB[k],d=document.createElement("div");d.className="wi";
      var a=document.createElement("p");a.className="qq";a.textContent="位置:"+b.h;d.appendChild(a);
      var an=document.createElement("p");an.className="ans";an.textContent="正確答案:"+b.a+"(答錯 "+fwo[k]+" 次)";d.appendChild(an);
      var r=document.createElement("button");r.className="rm";r.textContent="我學會了,移出錯題本";r.onclick=function(){var o=ld("aq_fw",{});delete o[k];sv("aq_fw",o);wbPage()};d.appendChild(r);L.appendChild(d)})}
}
function chapPage(){
  var c=CH[viewC];$("sub").textContent=c.n+" · "+c.Q.length+" 題";
  $("back").onclick=function(){viewC=-1;home();window.scrollTo(0,0)};
  $("only").onclick=function(){F.ch=[];F.src=-1;F.tp=[viewC];F.sc="all";sv("aq_f2",F);viewC=-1;home();window.scrollTo(0,0)};
  $("stat2").innerHTML="<div><b>"+ld("aq_best"+c.k,0)+"</b>最佳成績</div><div><b>"+wOf(viewC).length+"</b>錯題本</div><div><b>"+c.Q.length+"</b>題目數</div>";
  var L=$("qlist");L.innerHTML="";
  c.Q.forEach(function(q,i){var d=document.createElement("details");d.className="qi";var sm=document.createElement("summary");sm.textContent=(i+1)+". "+q[0];d.appendChild(sm);
    var ul=document.createElement("ul");[q[1],q[2],q[3],q[4]].forEach(function(t,k){var li=document.createElement("li");li.textContent=t;if(k===0){li.className="a";li.textContent="✔ "+t}ul.appendChild(li)});d.appendChild(ul);
    var p=document.createElement("p");p.textContent=c.EX[i]||q[5];d.appendChild(p);L.appendChild(d)});
}
function show(){
  var it=list[idx],q=CH[it[0]].Q[it[1]],opts=(F.sh?shuf:function(a){return sshuf(a,it[0]*1000+it[1]+1)})([q[1],q[2],q[3],q[4]]).sort(function(a,b){return (a==="以上皆是")-(b==="以上皆是")}),done=false;
  $("quiz").innerHTML='<div class="top"><span>第 '+(idx+1)+' / '+list.length+' 題</span><span>答對 '+right+'</span></div><div class="bar"><i style="width:'+(idx/list.length*100)+'%"></i></div><div class="card"><p class="q"></p><div id="os"></div><div id="ex"></div></div>';
  $("quiz").querySelector(".q").textContent=q[0];
  opts.forEach(function(t,i){
    var b=document.createElement("button");b.className="opt";b.dataset.k=i+1;b.textContent=t;
    b.onclick=function(){
      if(done)return;done=true;var ok=t===q[1];
      [].forEach.call($("os").children,function(x){x.disabled=true;if(x.textContent===q[1])x.classList.add("ok")});
      if(!ok)b.classList.add("no");
      var c=it[0],id=it[1],wl=wOf(c);
      if(ok){right++;wl=wl.filter(function(w){return w!==id})}else{miss.push(it);if(wl.indexOf(id)<0)wl.push(id)}
      sv("aq_wrong"+CH[c].k,wl);var sn=seenOf(c);if(sn.indexOf(id)<0){sn.push(id);sv("aq_seen"+CH[c].k,sn)}
      var e=document.createElement("div");e.className="exp";e.textContent=(ok?"✔ 答對了!":"✘ 答錯了。正確答案:"+q[1])+"\n"+(CH[c].EX[id]||q[5]);e.style.whiteSpace="pre-line";$("ex").appendChild(e);
      var n=document.createElement("button");n.className="primary";n.textContent=(idx+1<list.length?"下一題":"查看結果")+"(Enter)";n.onclick=function(){idx++;idx<list.length?show():finish()};$("ex").appendChild(n);
    };
    $("os").appendChild(b);
  });
}
function finish(){
  var sc=Math.round(right/list.length*100);
  var bkk="aq_best"+curKey();if(bestKey&&list.length>=10&&sc>ld(bkk,0))sv(bkk,sc);
  $("quiz").classList.add("hide");$("result").classList.remove("hide");
  var h='<div class="card"><p class="sub">測驗完成</p><p class="score">'+sc+' 分</p><p>答對 '+right+' / '+list.length+' 題</p>';
  if(miss.length){h+='<h3>本次答錯的題目</h3>';miss.forEach(function(){h+='<div class="wr"><b></b><br><small></small></div>'})}
  h+='<button class="primary" id="again">再練一次</button> <button class="ghost" id="hm">回首頁</button></div>';
  $("result").innerHTML=h;
  var ws=$("result").querySelectorAll(".wr");
  miss.forEach(function(it,i){var q=CH[it[0]].Q[it[1]];ws[i].querySelector("b").textContent=q[0];ws[i].querySelector("small").textContent="正確答案:"+q[1]+"。"+(CH[it[0]].EX[it[1]]||q[5])});
  $("again").onclick=home;$("hm").onclick=home;
}
document.addEventListener("keydown",function(e){
  if(/^[1-4]$/.test(e.key)){if(!e.repeat){var o=document.querySelector("#quiz:not(.hide) .opt[data-k='"+e.key+"']");if(o&&!o.disabled)o.click()}return}
  if(e.key!=="Enter"||e.repeat)return;
  if(e.target&&e.target.tagName==="BUTTON"&&e.target.classList.contains("primary"))return;
  var p=document.querySelector("#quiz:not(.hide) .primary")||document.querySelector("#result:not(.hide) #again");
  if(p){e.preventDefault();p.click()}
});
home();
</script>
